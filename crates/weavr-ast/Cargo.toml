[package]
name = "weavr-ast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AST-based merge strategies for weavr"
keywords = ["ast", "merge", "conflict", "language"]
categories = ["development-tools"]

[lints]
workspace = true

[features]
default = []
rust = ["dep:syn", "dep:quote", "dep:prettyplease", "dep:proc-macro2"]
csharp = ["dep:tree-sitter", "dep:tree-sitter-c-sharp", "dep:tree-sitter-language"]
typescript = ["dep:tree-sitter", "dep:tree-sitter-typescript", "dep:tree-sitter-language"]
go = []
all-languages = ["rust", "csharp", "typescript", "go"]

[dependencies]
weavr-core.workspace = true
thiserror.workspace = true

# Rust AST merger (feature-gated)
syn = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
prettyplease = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }

# C# AST merger (feature-gated)
tree-sitter = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-language = { workspace = true, optional = true }
