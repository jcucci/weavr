[package]
name = "weavr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI orchestration and headless mode for weavr"
keywords = ["cli", "merge", "conflict"]
categories = ["command-line-utilities"]

[[bin]]
name = "weavr"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["jj"]
jj = ["dep:weavr-jj"]
ai = ["dep:weavr-ai", "dep:tokio"]
ai-claude = ["ai", "weavr-ai/ai-claude"]
ai-openai = ["ai", "weavr-ai/ai-openai"]
ai-local = ["ai", "weavr-ai/ai-local"]
ai-all = ["ai-claude", "ai-openai", "ai-local"]
ast = ["dep:weavr-ast", "weavr-tui/ast"]
ast-rust = ["ast", "weavr-ast/rust"]
ast-csharp = ["ast", "weavr-ast/csharp"]
ast-typescript = ["ast", "weavr-ast/typescript"]
ast-go = ["ast", "weavr-ast/go"]
ast-all = ["ast-rust", "ast-csharp", "ast-typescript", "ast-go"]

[dependencies]
weavr-core.workspace = true
weavr-git.workspace = true
weavr-vcs.workspace = true
weavr-tui.workspace = true
clap.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
directories.workspace = true

# Optional AI support
weavr-ai = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# Optional jj (Jujutsu) support
weavr-jj = { workspace = true, optional = true }

# Optional AST support
weavr-ast = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
