name: Publish to crates.io

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    name: Publish crates
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Tier 1: No internal dependencies
      - name: Publish weavr-core
        run: cargo publish -p weavr-core

      - name: Publish weavr-git
        run: cargo publish -p weavr-git

      # Tier 2: Depend on core (retry with backoff for index propagation)
      - name: Publish weavr-ai
        run: .github/scripts/publish-with-retry.sh weavr-ai

      - name: Publish weavr-ast
        run: .github/scripts/publish-with-retry.sh weavr-ast

      - name: Publish weavr-tui
        run: .github/scripts/publish-with-retry.sh weavr-tui

      # Tier 3: Depends on all
      - name: Publish weavr-cli
        run: .github/scripts/publish-with-retry.sh weavr-cli
